    <script>
(() => {
  function decodeBase64(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
    return bytes;
  }

  async function unpack() {
    if (!("DecompressionStream" in window)) throw new Error("当前浏览器不支持题库解压，请换用最新版 Chrome、Edge 或 Safari。");
    const stream = new Blob([decodeBase64(window.SITE_PACKED || "")]).stream().pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(stream).text());
  }

  unpack().then((site) => {
    const style = document.createElement("style");
    style.textContent = site.css;
    document.head.append(style);
    document.body.innerHTML = site.body;
    window.STUDY_DATA = site.data;
    (0, eval)(site.app);
  }).catch((error) => {
    console.error(error);
    document.body.innerHTML = '<div style="padding:32px;font:16px system-ui;color:#7f1d1d;">题库加载失败，请刷新页面或换用最新版浏览器。</div>';
  });
})();
    </script>
  </body>
